<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Project - SportCraft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 font-bold text-lg text-slate-800">
                    <span class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center font-black">SC</span>
                    SportCraft Studio
                </div>
                <nav class="flex gap-1">
                    <a href="dashboard.html" class="px-3 py-2 text-sm font-semibold text-blue-600 bg-blue-50 rounded-lg">Dashboard</a>
                    <a href="gallery.html" class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 rounded-lg">Katalog Galeri</a>
                </nav>
            </div>
            
            <div id="headerUserInfo"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-slate-800">Daftar Project Order</h1>
                    <span id="roleBadge"></span>
                </div>
                <p class="text-xs text-slate-500 mt-1">Kelola pembuatan dan progres desain baju olahraga custom</p>
            </div>

            <button id="btnNewOrder" onclick="openModal('modalNewOrder')" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-500/20">
                + Buat Project Baru
            </button>
        </div>

        <!-- Filter Controls -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <input type="text" id="searchInput" onkeyup="renderOrderTable()" placeholder="Cari nama project / client..." class="px-4 py-2 border border-slate-200 rounded-lg text-sm w-full sm:w-64">

            <div class="flex gap-3">
                <select id="statusFilter" onchange="renderOrderTable()" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white">
                    <option value="ALL">Semua Status</option>
                    <option value="In Design">In Design</option>
                    <option value="Waiting Approval">Waiting Approval</option>
                    <option value="Revision">Revision</option>
                    <option value="Completed">Completed</option>
                </select>

                <div id="designerFilterBox" class="hidden">
                    <select id="designerFilter" onchange="renderOrderTable()" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-purple-50 text-purple-700 font-semibold">
                        <option value="ALL">Semua Task Desain</option>
                        <option value="MY">Ditugaskan ke Saya</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Table Data -->
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                            <th class="py-3 px-4">ID Order</th>
                            <th class="py-3 px-4">Project / Client</th>
                            <th class="py-3 px-4">Spesifikasi</th>
                            <th class="py-3 px-4">Penugasan</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Hasil Desain</th>
                            <th class="py-3 px-4 text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form New Order (Marketing) -->
    <div id="modalNewOrder" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl modal-box">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Input Order Baru</h3>
            <form onsubmit="handleCreateOrder(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Project</label>
                    <input type="text" id="orderTitle" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Client</label>
                        <input type="text" id="clientName" required class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jumlah (PCS)</label>
                        <input type="number" id="orderQty" required min="1" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Olahraga</label>
                        <select id="sportType" class="w-full px-3 py-2 border rounded-lg">
                            <option value="football">Sepakbola</option>
                            <option value="basketball">Basket</option>
                            <option value="volleyball">Voli</option>
                            <option value="running">Running</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kerah</label>
                        <select id="collarType" class="w-full px-3 py-2 border rounded-lg">
                            <option value="vneck">V-Neck</option>
                            <option value="round">Round Neck</option>
                            <option value="polo">Polo Collar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Bahan</label>
                        <select id="fabricType" class="w-full px-3 py-2 border rounded-lg">
                            <option value="dryfit-milano">Dryfit Milano</option>
                            <option value="dryfit-zara">Dryfit Zara</option>
                            <option value="poly-mesh">Poly Mesh</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Desainer</label>
                    <select id="assignedDesigner" class="w-full px-3 py-2 border rounded-lg">
                        <option value="Rian (Desainer 1)">Rian (Desainer 1)</option>
                        <option value="Dewi (Desainer 2)">Dewi (Desainer 2)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">URL Referensi Mockup (Opsional)</label>
                    <input type="url" id="refImgUrl" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Pesanan</label>
                    <textarea id="orderNotes" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('modalNewOrder')" class="px-4 py-2 bg-slate-100 rounded-lg text-slate-600">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold">Simpan Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Upload Design (Desainer) -->
    <div id="modalUpload" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl modal-box">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Upload Hasil Desain JPG/PNG</h3>
            <form onsubmit="handleUploadDesign(event)" class="space-y-4 text-sm">
                <input type="hidden" id="uploadOrderId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">URL Gambar Render Hasil Desain</label>
                    <input type="url" id="designImgUrl" required placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('modalUpload')" class="px-4 py-2 bg-slate-100 rounded-lg">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold">Upload & Ajukan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Shared -->
    <script src="js/app-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
